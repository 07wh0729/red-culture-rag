<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红色文化智能学习平台</title>
<link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="brand">
            <span class="logo-icon">🚩</span>
            <h1>红色文化智能学习平台</h1>
        </a>
    </div>
</header>

<div class="container" id="app">

    <!-- 标签导航 -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="qa">💬 智能问答</button>
        <button class="tab-btn" data-tab="quiz">📝 在线测验</button>
        <button class="tab-btn" data-tab="knowledge">📚 知识浏览</button>
        <button class="tab-btn" data-tab="media">🎬 红色资源</button>
        <button class="tab-btn" data-tab="narrate">🎙️ 故事播报</button>
    </div>

    <!-- 智能问答 -->
    <div class="tab-content active" id="tab-qa">
        <div class="card">
            <h3>🤖 RAG 智能问答</h3>
            <div class="ask-area">
                <input type="text" id="qa-input" placeholder="输入你想了解的问题，如：井冈山精神的核心内涵是什么？" />
                <button onclick="doAsk()">🔍 智能提问</button>
            </div>
            <div class="loading" id="qa-loading"><span class="spinner"></span>正在检索知识库并生成回答...</div>
            <div class="answer-box" id="qa-answer">
                <div class="answer-text" id="qa-text"></div>
                <div class="sources" id="qa-sources"></div>
                <div class="media-grid" id="qa-media"></div>
            </div>
        </div>
    </div>

    <!-- 在线测验 -->
    <div class="tab-content" id="tab-quiz">
        <div class="card">
            <h3>📝 智能在线测验</h3>
            <p class="card-desc">基于知识库自动出题，支持单选、多选、简答，自动判分与错题解析</p>
            <div class="card-divider"></div>
            <div class="quiz-setup">
                <input type="text" id="quiz-topic" value="红色文化" placeholder="测验主题" style="width:160px;" />
                <select id="quiz-type">
                    <option value="single">单选题</option>
                    <option value="multi">多选题</option>
                    <option value="short">简答题</option>
                </select>
                <select id="quiz-num">
                    <option value="3">3 题</option>
                    <option value="5" selected>5 题</option>
                    <option value="10">10 题</option>
                </select>
                <button onclick="doQuizGenerate()">🎲 生成题目</button>
            </div>
            <div class="loading" id="quiz-loading"><span class="spinner"></span>正在检索知识库并生成题目...</div>
            <div id="quiz-questions"></div>
            <button class="submit-btn" id="quiz-submit" style="display:none;" onclick="doQuizSubmit()">📊 提交并查看成绩</button>
            <div id="quiz-result"></div>
        </div>
    </div>

    <!-- 知识浏览 -->
    <div class="tab-content" id="tab-knowledge">
        <div class="card">
            <h3>📚 知识库浏览</h3>
            <p class="card-desc">点击卡片查看红色文化知识点详情</p>
            <div class="card-divider"></div>
            <div class="loading" id="kb-loading"><span class="spinner"></span>加载中...</div>
            <div class="knowledge-grid" id="kb-grid"></div>
        </div>
        <div class="card" id="kb-detail" style="display:none;">
            <h3 id="kb-title"></h3>
            <div id="kb-content"></div>
            <button style="margin-top:14px;padding:10px 24px;border:2px solid var(--border);border-radius:8px;background:white;cursor:pointer;font-size:14px;transition:all var(--transition);" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text)'" onclick="document.getElementById('kb-detail').style.display='none';">← 返回列表</button>
        </div>
    </div>

    <!-- 红色资源 -->
    <div class="tab-content" id="tab-media">
        <div class="card">
            <h3>🎬 红色文化资源库</h3>
            <p class="card-desc">浏览红色文化主题图片、视频、音频素材</p>
            <div class="card-divider"></div>
            <div class="media-browser filter-bar">
                <button class="active" onclick="filterMedia('all')">全部</button>
                <button onclick="filterMedia('images')">🖼️ 图片</button>
                <button onclick="filterMedia('videos')">🎥 视频</button>
                <button onclick="filterMedia('audio')">🎵 音频</button>
            </div>
            <div class="loading" id="media-loading"><span class="spinner"></span>加载中...</div>
            <div class="media-grid" id="media-grid"></div>
        </div>
    </div>

    <!-- 故事播报 -->
    <div class="tab-content" id="tab-narrate">
        <div class="card">
            <h3>🎙️ 红色故事语音播报</h3>
            <p class="card-desc" id="narrate-desc">输入主题，AI 自动撰写文稿并合成语音播报</p>
            <div class="card-divider"></div>
            <div style="display:flex;gap:16px;margin-bottom:16px;align-items:center;">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text-secondary);">
                    <input type="radio" name="narrate-mode" value="ai" checked onchange="toggleNarrateMode()" style="accent-color:var(--red);" /> AI 直接生成播报
                </label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text-secondary);">
                    <input type="radio" name="narrate-mode" value="manual" onchange="toggleNarrateMode()" style="accent-color:var(--red);" /> 自己填写内容
                </label>
            </div>
            <div class="ask-area" id="narrate-ai-area">
                <input type="text" id="narrate-topic" placeholder="输入主题，如：董存瑞舍身炸碉堡、刘胡兰的故事..." />
                <button onclick="doGenerateNarration()" id="narrate-gen-btn">✍️ AI 生成播报</button>
            </div>
            <div id="narrate-manual-area" style="display:none;">
                <textarea id="narrate-text" style="width:100%;min-height:180px;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius-xs);font-size:14px;resize:vertical;line-height:1.8;" placeholder="在此输入想要朗读的故事文本..."></textarea>
                <button class="submit-btn" onclick="doNarrate()" style="margin-top:16px;">🎙️ 生成语音播报</button>
            </div>
            <div class="loading" id="narrate-loading"><span class="spinner"></span>正在合成语音...</div>
            <div id="narrate-result"></div>
        </div>
    </div></div>

</div>

<div class="toast" id="toast"></div>

<script src="/static/js/app.js?v=4"></script>
</body>
</html>
